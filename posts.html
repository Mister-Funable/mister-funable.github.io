  <!-- Main Content -->

      <!-- Featured Post -->

      <!-- Category Tabs -->

        <button class="posts-tab active" data-category="all" data-lang-en="All" data-lang-jp="すべて" data-lang-es="Todos">All</button>
        <button class="posts-tab" data-category="anime-dolls" data-lang-en="Anime & Dolls" data-lang-jp="アニメ＆ドール" data-lang-es="Anime y Muñecas">Anime & Dolls</button>
        <button class="posts-tab" data-category="tech" data-lang-en="Tech" data-lang-jp="テック" data-lang-es="Tecnología">Tech</button>
      </nav>

      <!-- Unified Grid -->
      <div class="posts-grid" id="posts-all-grid"></div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/navbar-loader.js"></script>
  <script src="/js/footer-loader.js"></script>
  <script src="/js/page-banner.js"></script>
  <script src="/js/language-switcher.js"></script>
  <script>
  (function() {
    var posts = [
      { id:"01", title:"Running N8N Locally with Ngrok", category:"tech", image:"/medium/images/01/img-01.png", published:"2025-10-27", description:"Run N8N locally and expose it via Ngrok tunnel for webhook callbacks." },
      { id:"02", title:"How (Not) to Work with Local Files in N8N", category:"tech", image:"/medium/images/02/img-01.png", published:"2025-11-10", description:"Lessons learned automating video uploads and working with local files in n8n." },
      { id:"03", title:"Getting Started with Meshtastic on Heltec V3 and LILYGO T-Beam", category:"tech", image:"/medium/images/03/img-01.png", published:"2025-11-14", description:"Introduction to Meshtastic mesh networking with Heltec V3 and LILYGO T-Beam devices." },
      { id:"04", title:"Meshtastic Questions I Had After Getting Started", category:"tech", image:"/medium/images/04/img-01.png", published:"2025-11-14", description:"Q&A covering common Meshtastic questions from beginner to intermediate level." },
      { id:"05", title:"Setting Up a Local Meshtastic Message Forwarder", category:"tech", image:"/medium/images/05/img-01.png", published:"2025-11-14", description:"Set up a local forwarder that listens to Meshtastic channels and exports messages via Python." },
      { id:"06", title:"N8N Nodes You Should Know (But Probably Don't)", category:"tech", image:"/medium/images/06/img-01.png", published:"2025-11-16", description:"Overlooked N8N nodes that simplify projects and reduce maintenance." },
      { id:"07", title:"Sony A6700 Settings for Unboxing and Figure Videos", category:"anime-dolls", image:"/medium/images/07/img-01.png", published:"2025-11-17", description:"Camera settings guide for the Sony A6700 for recording unboxing and collectible videos." },
      { id:"08", title:"Fixing N8N Docker Error: The X-Forwarded-For Issue + Bonus", category:"tech", image:"/medium/images/08/img-01.png", published:"2025-11-18", description:"Troubleshooting X-Forwarded-For header and trust proxy issues in N8N Docker with Ngrok." },
      { id:"09", title:"Getting Instagram Posts with N8N (The Simple Way Part 1)", category:"tech", image:"/medium/images/09/img-01.png", published:"2025-11-18", description:"Streamlined guide for automating Instagram post sharing through N8N." },
      { id:"10", title:"Figma Body Alternatives: From Archetypes to\u2026 Art", category:"anime-dolls", image:"/medium/images/10/img-01.png", published:"2025-11-19", description:"Exploring alternative body options for Figma figures beyond the standard Archetype She." },
      { id:"11", title:"How to Publish Your n8n Template", category:"tech", image:"/medium/images/11/img-01.png", published:"2025-11-21", description:"Guide to sharing custom n8n workflow templates with the community." },
      { id:"12", title:"About Prompts, AI and Playing with Nanobana Pro", category:"anime-dolls", image:"/medium/images/12/img-01.png", published:"2025-11-21", description:"AI image generation and prompt engineering using character design as a case study." },
      { id:"13", title:"My Favorite Figmas \u2014 2025", category:"anime-dolls", image:"/medium/images/13/img-01.png", published:"2025-11-26", description:"A personal showcase of 160+ Figma collectibles with commentary on favorites." },
      { id:"14", title:"Backing Up N8N When the Data Lives in a Docker Volume", category:"tech", image:"/medium/images/14/img-01.png", published:"2025-12-06", description:"How to back up and migrate n8n workflows and credentials stored in a Docker volume." },
      { id:"15", title:"BoardGameGeek Player Resources / Aids", category:"tech", image:"/medium/images/15/img-01.png", published:"2025-12-21", description:"Finding community-made player aids and quick-reference sheets on BoardGameGeek." },
      { id:"16", title:"Marvel Champions Resources", category:"tech", image:"/medium/images/16/img-01.png", published:"2025-12-21", description:"Curated Marvel Champions LCG resources including guides, deck builders, and reference materials." },
      { id:"17", title:"Sony A6700 Updated Settings for Turntables with a Green Background", category:"anime-dolls", image:"/medium/images/17/img-01.png", published:"2025-12-27", description:"Updated camera settings for shooting figure turntable videos with a green background." },
      { id:"18", title:"A Silly Little osascript Utility That Types Notes For You", category:"tech", image:"/medium/images/18/img-01.png", published:"2025-12-29", description:"A small AppleScript utility that picks a random line and types it into TextEdit on macOS." },
      { id:"19", title:"How to Design Your Medium Profile", category:"tech", image:"/medium/images/19/img-01.png", published:"2025-12-29", description:"Customizing your Medium profile to match your branding across platforms." },
      { id:"20", title:"Getting Instagram Posts with N8N (The Simple Way Part 2: The Final Part)", category:"tech", image:"/medium/images/20/img-01.png", published:"2025-12-31", description:"Building an n8n workflow that auto-fetches Instagram posts and cross-posts them to Twitter/X." },
      { id:"21", title:"Adding Multiple Instagram Accounts to Your n8n Automation", category:"tech", image:"/medium/images/21/img-01.png", published:"2026-01-01", description:"Extending an n8n Instagram workflow to support multiple accounts via the Meta Developer Portal." },
      { id:"22", title:"From Zero \u2014 YouTube Lessons Part 0", category:"tech", image:"/medium/images/22/img-01.png", published:"2026-01-03", description:"Reflections on losing a YouTube channel and lessons learned about starting over." },
      { id:"23", title:"From Zero \u2014 YouTube Lessons Part 1", category:"tech", image:"/medium/images/23/img-01.png", published:"2026-01-03", description:"Practical advice on growing a YouTube channel from personal experience reaching 1,000+ subs." },
      { id:"24", title:"Part 3\u2014 Designing a Mascot/Logo: A Fresh Start", category:"tech", image:"/medium/images/24/img-01.png", published:"2026-01-05", description:"Redesigning a channel mascot using AI image generation for a simplified recognizable design." },
      { id:"25", title:"Why Your AI Images Look Worse After Each Iteration", category:"tech", image:"/medium/images/25/img-01.png", published:"2026-01-12", description:"Why repeatedly iterating over AI-generated images degrades quality and what to do about it." },
      { id:"26", title:"Uploading Instagram Videos to YouTube with n8n", category:"tech", image:"/medium/images/26/img-01.png", published:"2026-01-17", description:"An n8n workflow that pulls videos from Instagram and uploads them to YouTube on a schedule." },
      { id:"27", title:"Side Notes #1: What Yu-Gi-Oh Taught Me About Leadership", category:"tech", image:"/medium/images/27/img-01.png", published:"2026-01-23", description:"Connecting lessons from playing Yu-Gi-Oh to the leadership skill of helping people shine." },
      { id:"28", title:"Claude Code (Part 1): Do You Actually Need This If You Have Cursor?", category:"tech", image:"/medium/images/28/img-01.png", published:"2026-01-23", description:"Overview of Claude Code as a terminal AI coding assistant and how it complements Cursor." }
    ];

    var sorted = posts.slice().sort(function(a,b){ return b.published.localeCompare(a.published); });
    function fmt(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
    function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    function catLabel(c){ return c === 'anime-dolls' ? 'Anime & Dolls' : 'Tech'; }

    // Featured post (most recent)
    var feat = sorted[0];
    var featEl = document.getElementById('posts-featured');
    if(featEl && feat){
      featEl.innerHTML = '<a href="/posts/article.html?id='+feat.id+'" class="posts-featured-card">' +
        '<div class="posts-featured-img"><img src="'+esc(feat.image)+'" alt="'+esc(feat.title)+'" /></div>' +
        '<div class="posts-featured-body">' +
          '<span class="ds-label" style="color:var(--ds-gold)">'+esc(catLabel(feat.category))+' &middot; Latest</span>' +
          '<h2 class="posts-featured-title">'+esc(feat.title)+'</h2>' +
          '<p class="posts-featured-desc">'+esc(feat.description)+'</p>' +
          '<time class="posts-featured-date" datetime="'+feat.published+'">'+fmt(feat.published)+'</time>' +
        '</div></a>';
    }

    // Grid cards (skip featured)
    var rest = sorted.slice(1);
    var activeCategory = 'all';

    function renderGrid(category){
      var filtered = category === 'all' ? rest : rest.filter(function(p){ return p.category === category; });
      var grid = document.getElementById('posts-all-grid');
      var html = '';
      for(var i=0; i<filtered.length; i++){
        var p = filtered[i];
        html += '<a href="/posts/article.html?id='+p.id+'" class="post-card" data-category="'+p.category+'">' +
          '<div class="post-card-img"><img src="'+esc(p.image)+'" alt="'+esc(p.title)+'" loading="lazy" /></div>' +
          '<div class="post-card-body">' +
            '<span class="post-card-cat ds-label">'+esc(catLabel(p.category))+'</span>' +
            '<h3 class="post-card-title">'+esc(p.title)+'</h3>' +
            '<p class="post-card-desc">'+esc(p.description)+'</p>' +
            '<time class="post-card-date" datetime="'+p.published+'">'+fmt(p.published)+'</time>' +
          '</div></a>';
      }
      grid.innerHTML = html;
    }

    renderGrid('all');

    // Tab switching
    var tabs = document.querySelectorAll('.posts-tab');
    tabs.forEach(function(tab){
      tab.addEventListener('click', function(){
        tabs.forEach(function(t){ t.classList.remove('active'); });
        this.classList.add('active');
        renderGrid(this.dataset.category);
      });
    });

    // Handle hash navigation
    var hash = window.location.hash.replace('#','');
    if(hash === 'anime-dolls' || hash === 'tech'){
      tabs.forEach(function(t){
        t.classList.remove('active');
        if(t.dataset.category === hash) t.classList.add('active');
      });
      renderGrid(hash);
    }
  })();
  </script>
</body>
</html>
